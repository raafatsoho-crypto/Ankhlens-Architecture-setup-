name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Flutter Project & Merge Code
        run: |
          mkdir temp_build
          cd temp_build
          flutter create --org com.ankhlens --project-name ankhlens .
          rm -rf lib
          cp -r ../lib .
          # Copy your actual dependency manifest and lockfile
          cp ../pubspec.yaml .
          if [ -f ../pubspec.lock ]; then cp ../pubspec.lock .; fi
          # Copy assets, fonts, or any other top-level folders your app needs
          if [ -d ../assets ]; then cp -r ../assets .; fi
          flutter pub get

      - name: Build APK (Release)
        working-directory: temp_build
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: temp_build/build/app/outputs/flutter-apk/app-release.apk
